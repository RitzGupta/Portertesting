"on":
    push:
        branches:
            - main
name: Deploy to portertesting
jobs:
    porter-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4
            - name: Set Github tag
              id: vars
              run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
            - name: Setup porter
              uses: porter-dev/setup-porter@v0.2.0
            - name: Deploy stack
              timeout-minutes: 30
              run: porter apply
              env:
                PORTER_APP_NAME: portertesting
                PORTER_CLUSTER: "6130"
                PORTER_DEPLOYMENT_TARGET_ID: 6b1ce381-c599-486d-a911-625353329be3
                PORTER_HOST: https://dashboard.porter.run
                PORTER_PROJECT: "19911"
                PORTER_TAG: ${{ steps.vars.outputs.sha_short }}
                PORTER_TOKEN: ${{ secrets.PORTER_APP_19911_26369 }}
